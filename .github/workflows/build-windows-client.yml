name: Build Windows client installer

# Se déclenche automatiquement quand client.py, requirements.txt ou le
# dossier packaging/windows/ changent sur main, ou manuellement depuis
# l'onglet "Actions" du dépôt GitHub (bouton "Run workflow").
on:
  push:
    branches: [ main ]
    paths:
      - "client.py"
      - "requirements.txt"
      - "packaging/windows/**"
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour repousser releases/CameraClient-Setup.exe dans le dépôt

# Empêche deux exécutions de tourner en même temps sur la même branche :
# c'est la cause la plus fréquente du "fetch first" (deux jobs qui partent
# du même commit puis essaient de pousser chacun leur propre commit).
concurrency:
  group: build-windows-client-${{ github.ref }}
  cancel-in-progress: false   # on laisse le run en cours se terminer plutôt que de l'interrompre

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construire CameraClient.exe (sans fenêtre)
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name CameraClient
          --specpath build --workpath build\work-client-gui --distpath dist client.py

      - name: Construire CameraClient-console.exe (diagnostic)
        run: >
          pyinstaller --noconfirm --clean --onefile --console --name CameraClient-console
          --specpath build --workpath build\work-client-console --distpath dist client.py

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Diagnostic avant compilation (fichiers attendus par installer.iss)
        shell: cmd
        run: |
          echo == Repertoire de travail ==
          cd
          echo == Contenu de dist\ (attendu par [Files] Source) ==
          dir dist
          echo == Contenu de packaging\windows\ (doit contenir installer.iss) ==
          dir packaging\windows
          echo == Contenu de releases\ (attendu par OutputDir) ==
          dir releases

      - name: Construire l'installateur silencieux (CameraClient-Setup.exe)
        shell: cmd
        run: |
          cd packaging\windows
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Mettre l'installateur à disposition du workflow (résultat immédiat)
        uses: actions/upload-artifact@v4
        with:
          name: CameraClient-Setup
          path: releases/CameraClient-Setup.exe

      - name: Publier l'installateur dans le dépôt (releases/)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/CameraClient-Setup.exe

          if git diff --staged --quiet; then
            echo "Rien de nouveau à publier"
            exit 0
          fi

          git commit -m "Build automatique de CameraClient-Setup.exe [skip ci]"

          # Si main a bougé entre le checkout et ce push (run concurrent,
          # push humain pendant le build...), on récupère les derniers
          # commits et on rejoue le nôtre par-dessus avant de réessayer.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push réussi"
              exit 0
            fi
            echo "Push refusé, nouvelle tentative ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done

          echo "Échec du push après plusieurs tentatives" >&2
          exit 1