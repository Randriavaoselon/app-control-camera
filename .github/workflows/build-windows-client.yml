name: Build Windows client installer

on:
  push:
    branches: [main]
    paths:
      - "client.py"
      - "requirements.txt"
      - "embedded_config.py"
      - "packaging/windows/**"
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour publier la GitHub Release

concurrency:
  group: build-windows-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier embedded_config.py (URL du serveur intégrée au client)
        shell: cmd
        run: |
          if not exist embedded_config.py (
            echo ERREUR : embedded_config.py est introuvable dans le depot.
            exit /b 1
          )
          type embedded_config.py

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construire CameraClient.exe (sans fenêtre)
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name CameraClient
          --specpath build --workpath build\work-client-gui --distpath dist client.py

      - name: Construire CameraClient-console.exe (diagnostic)
        run: >
          pyinstaller --noconfirm --clean --onefile --console --name CameraClient-console
          --specpath build --workpath build\work-client-console --distpath dist client.py

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      # releases/ n'est plus versionné dans le dépôt (il ne contient plus que
      # des fichiers générés) : on le recrée nous-mêmes avant qu'Inno Setup
      # n'y écrive CameraClient-Setup.exe.
      - name: Préparer le dossier releases\
        shell: cmd
        run: if not exist releases mkdir releases

      - name: Diagnostic avant compilation (fichiers attendus par installer.iss)
        shell: cmd
        run: |
          echo == Repertoire de travail ==
          cd
          echo == Contenu de dist\ (attendu par [Files] Source) ==
          dir dist
          echo == Contenu de packaging\windows\ (doit contenir installer.iss) ==
          dir packaging\windows
          echo == Contenu de releases\ (attendu par OutputDir) ==
          dir releases

      - name: Construire l'installateur silencieux (CameraClient-Setup.exe)
        shell: cmd
        run: |
          cd packaging\windows
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Vérifier que l'installateur a bien été créé
        shell: cmd
        run: |
          if not exist releases\CameraClient-Setup.exe (
            echo ERREUR : releases\CameraClient-Setup.exe n'a pas ete cree.
            exit /b 1
          )
          dir releases

      - name: Mettre l'installateur à disposition du workflow (résultat immédiat)
        uses: actions/upload-artifact@v4
        with:
          name: CameraClient-Setup
          path: releases/CameraClient-Setup.exe

      - name: Publier l'installateur comme GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: client-latest
          name: CameraClient (dernière build)
          body: "Installateur généré automatiquement — build du ${{ github.sha }}"
          files: releases/CameraClient-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}