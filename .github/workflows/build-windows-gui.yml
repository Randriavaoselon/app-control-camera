# .github/workflows/build-windows-gui.yml
name: Build Windows server GUI

on:
  push:
    branches: [ main ]
    paths:
      - "server_gui.py"
      - "requirements-gui.txt"
      - "embedded_config.py"
      - "packaging/icons/**"
      - "packaging/windows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la présence de l'icône de la GUI
        shell: cmd
        run: |
          if not exist packaging\icons\camera_gui.ico (
            echo ERREUR : packaging\icons\camera_gui.ico est introuvable.
            exit /b 1
          )
          echo Icone de la GUI trouvee :
          dir packaging\icons\camera_gui.ico

      - name: Vérifier la présence du fichier de métadonnées (éditeur Tonec Inc.)
        shell: cmd
        run: |
          if not exist packaging\windows\version_gui.txt (
            echo ERREUR : packaging\windows\version_gui.txt est introuvable.
            exit /b 1
          )
          echo Fichier de metadonnees trouve :
          type packaging\windows\version_gui.txt

      - name: Vérifier embedded_config.py (URL embarquée dans la GUI)
        shell: cmd
        run: |
          if not exist embedded_config.py (
            echo ERREUR : embedded_config.py est introuvable.
            exit /b 1
          )
          echo URL embarquee :
          type embedded_config.py

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install pyinstaller

      # IMPORTANT : PyInstaller résout --icon, --add-data et --version-file
      # relativement au .spec (créé dans build/ à cause de --specpath), pas au
      # répertoire courant. On passe donc des chemins ABSOLUS via
      # ${{ github.workspace }}.
      #
      # --add-data embedded_config.py;. : embarque l'URL de production dans la
      # GUI. server_gui.py lit ce fichier en priorité après --server et
      # config.json, avec repli silencieux sur 127.0.0.1:5050 s'il est absent.
      # --collect-all tkintermapview : embarque aussi les fichiers non-Python
      # du paquet (icônes des marqueurs de la carte...).
      - name: Construire CameraServerGUI.exe (sans fenêtre)
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name CameraServerGUI
          --collect-all tkintermapview
          --icon "${{ github.workspace }}\packaging\icons\camera_gui.ico"
          --version-file "${{ github.workspace }}\packaging\windows\version_gui.txt"
          --add-data "${{ github.workspace }}\embedded_config.py;."
          --specpath build --workpath build\work-server-gui --distpath dist server_gui.py

      - name: Mettre l'exécutable à disposition du workflow (résultat immédiat)
        uses: actions/upload-artifact@v4
        with:
          name: CameraServerGUI
          path: dist/CameraServerGUI.exe

      - name: Publier l'exécutable dans le dépôt (releases/)
        shell: bash
        run: |
          mkdir -p releases
          cp dist/CameraServerGUI.exe releases/CameraServerGUI.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/CameraServerGUI.exe
          git diff --staged --quiet && echo "Rien de nouveau à publier" || \
            (git commit -m "Build automatique de CameraServerGUI.exe [skip ci]" && git push)